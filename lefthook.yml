# Git hooks managed by lefthook.
# Installed by `lefthook install`, which runs automatically on `pnpm install` (root "prepare" script).
# Fast checks only — CI re-runs everything, because hooks can be skipped with --no-verify.

pre-commit:
  piped: true
  jobs:
    - name: secrets
      run: gitleaks git --pre-commit --staged --redact --verbose

    # Topics the owner excluded from the published data. The patterns live in a git-ignored file, because
    # they would reveal what they exclude; without that file (a fresh clone) the job passes.
    - name: private terms
      root: packages/cv-data/
      glob: "*.ts"
      run: test ! -f ../../.private-terms.local || ! grep -n -i -E -f ../../.private-terms.local {staged_files}

    - name: format
      glob: "*"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    # ESLint runs inside each package, so it finds that package's eslint.config.js and tsconfig.
    # Same command as `pnpm lint`, on the staged files only. A package gets a job once it has a config.
    - name: lint
      group:
        parallel: true
        jobs:
          - name: lint domain
            root: packages/domain/
            glob: "*.{ts,tsx,js,mjs,cjs}"
            run: pnpm exec eslint {staged_files}

          - name: lint cv-data
            root: packages/cv-data/
            glob: "*.{ts,tsx,js,mjs,cjs}"
            run: pnpm exec eslint {staged_files}

          - name: lint db
            root: packages/db/
            glob: "*.{ts,tsx,js,mjs,cjs}"
            run: pnpm exec eslint {staged_files}

          - name: lint web
            root: apps/web/
            glob: "*.{ts,tsx,js,mjs,cjs}"
            run: pnpm exec eslint {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
