packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"
allowBuilds:
  esbuild: false
  lefthook: false
catalog:
  '@commitlint/cli': ^21.2.4
  '@commitlint/config-conventional': ^21.2.4
  '@eslint/js': ^10.0.1
  '@types/node': ^26.6.6
  eslint: ^10.14.0
  eslint-config-prettier: ^10.1.8
  lefthook: ^2.2.2
  prettier: ^3.9.10
  typescript: ^7.0.2
  typescript-eslint: ^8.72.1
  vitest: ^5.1.0
  zod: ^4.6.7
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: "10"
    eslint-plugin-jsx-a11y>eslint: "10"
    eslint-plugin-react>eslint: "10"
# A version must be 7 days old before pnpm installs it (time for a compromised release to be caught).
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Browser data published almost daily, read only by build tools.
  - caniuse-lite
  - electron-to-chromium
  # Pulled in by the shadcn CLI; 7.2.0 was released on 2026-11-08, so it is old enough on 2026-11-15: remove it then.
  - postcss-selector-parser@7.2.0
