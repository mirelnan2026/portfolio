# Dependabot opens pull requests for outdated dependencies; each one runs CI and gets a Vercel preview, and is
# merged only when both are green (the ruleset on main). Security updates are separate and not delayed.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspaces are read from pnpm-lock.yaml and pnpm-workspace.yaml (catalog)
    directory: /
    schedule:
      interval: weekly
      day: monday
    # The same rule as pnpm's minimumReleaseAge: a version must be 7 days old before it is proposed.
    cooldown:
      default-days: 7
    groups:
      # One pull request a week for everything that should not break the code.
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is the Go rewrite and has no JavaScript compiler API yet, which Next.js, typescript-eslint
      # and drizzle-kit need (see "Tooling decisions" in CLAUDE.md). Stay on 6.x until they support it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions # keeps the SHA-pinned actions in ci.yml current
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
